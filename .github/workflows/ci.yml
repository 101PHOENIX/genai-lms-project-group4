name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  case-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the sample case file
        run: python tools/validate_case.py narrative/sample_case.json --context narrative/game_context.json

  core-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Core rule tests
        run: dotnet test tests/CoreTests
